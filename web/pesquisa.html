<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explorar Livros | BookMatch</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        NextRead
    </a>

    <nav class="menu">
        <a href="index.html">Início</a>
        <a href="pesquisa.html">Explorar</a>
        <a href="salvos.html">Meus Livros</a>
        <a href="recomendacoes.html">Recomendações</a>
    </nav>

    <a href="login.html" class="btn-login">
        Entrar
    </a>

</header>


<main>

    <section class="pesquisa-topo">

        <div class="pesquisa-topo-conteudo">

            <span class="subtitulo">
                Explore
            </span>

            <h1>
                Encontre novos livros
            </h1>

            <p>
                Pesquise por título, autor ou categoria.
            </p>


            <form class="barra-pesquisa" id="form-pesquisa">

                <input
                    type="text"
                    id="busca"
                    name="busca"
                    aria-label="Buscar por título ou autor"
                    placeholder="Pesquisar livros..."
                >

                <button type="submit">
                    Pesquisar
                </button>

            </form>

        </div>

    </section>


    <section class="explorar-container">

        <aside class="filtros">

            <h3>Filtros</h3>


            <div class="grupo-filtro">

                <label for="categoria">
                    Categoria
                </label>

                <select id="categoria" aria-label="Filtrar por categoria">
                    <option value="">Todas</option>
                </select>

            </div>


            <button class="btn-filtro" id="aplicar-filtros" type="button">
                Aplicar filtros
            </button>

        </aside>


        <section class="resultados">

            <div class="resultados-cabecalho">

                <div>

                    <span class="subtitulo">
                        Resultados
                    </span>

                    <h2>
                        Livros encontrados
                    </h2>

                </div>

                <span class="quantidade-resultados">
                    Carregando livros...
                </span>

            </div>


            <p id="mensagem-resultados" class="mensagem-api" role="status" aria-live="polite">Carregando catálogo...</p>
            <div class="livros-grid" id="lista-livros"></div>
            <nav class="paginacao-api" aria-label="Paginação dos livros">
                <button type="button" id="pagina-anterior" disabled>Anterior</button>
                <span id="pagina-atual">Página 1</span>
                <button type="button" id="pagina-proxima" disabled>Próxima</button>
            </nav>

        </section>

    </section>

</main>


<footer class="footer">

    <strong>
        NextRead
    </strong>

    <p>
        Projeto Integrador — DSM 6º Semestre — FATEC Franca
    </p>

</footer>

<script src="Javascript/script.js" defer></script>
</body>
</html>
